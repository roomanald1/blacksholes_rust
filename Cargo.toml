[package]
name = "blacksholes_rust"
version = "0.1.0"
edition = "2024"


# This creates both a library and a binary
[lib]
path = "src/lib.rs"

[[bin]]
name = "blacksholes_rust"  # Optional if same as package name
path = "src/main.rs"


[[bench]]
name = "criterion_benchmark"
harness = false  # Disables default libtest harness for Criterion.rs

#[profile.test]
#debug = true
#opt-level = 0  # Match default dev profile
#strip = false

#[profile.release]
#debug = true               # Maximum debug info
#opt-level = 3           # Keep optimizations
#strip = false

#[profile.bench]
#debug = true              # Maximum debug info
#opt-level = 3           # Keep optimizations
#strip = false

[dependencies]
approx = "0.5.1"
libm = "0.2.11"
async-stream = "0.3.6"
futures = "0.3.31"
futures-signals = "0.3.34"
rand = "0.9.0"
tokio = {  version = "1.44.1", features = ["time", "rt", "macros", "rt-multi-thread", "signal"] }
time = "0.3.41"
libc = "0.2.171"
rand_distr = "0.5.1"
rayon = "1.10.0"
dhat = "0.3.3"
csv = "1.3.1"
serde = "1.0.219"
statrs = "0.18.0"
pprof = { version = "0.14.0", features = ["flamegraph", "criterion"] }
criterion = { version= "0.5.1", features = ["html_reports"] }
reqwest = { version = "0.12.15", features = ["json"] }
zip = "2.6.1"
chrono = "0.4.40"
serde_json = "1.0.140"
nalgebra = "0.33.2"
